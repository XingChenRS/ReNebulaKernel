name: Build ReNebula GKI Image

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Select one immutable Google GKI release snapshot
        required: true
        type: choice
        options:
          - __select_release_id__
          # BEGIN GENERATED RELEASE OPTIONS
          - android12-5.10-lts-2026-08-03
          - android13-5.10-lts-2026-08-03
          - android13-5.15-lts-2026-08-03
          - android14-5.15-lts-2026-08-03
          - android14-6.1-lts-2026-08-03
          - android15-6.6-lts-2026-08-03
          - android16-6.12-lts-2026-08-03
          - android17-6.18-lts-2026-08-03
          # END GENERATED RELEASE OPTIONS
        default: __select_release_id__
      root_provider:
        description: Select one audited root provider
        required: true
        type: choice
        options:
          - __select_root_provider__
          # BEGIN GENERATED ROOT PROVIDER OPTIONS
          - none
          - resukisu
          # END GENERATED ROOT PROVIDER OPTIONS
        default: __select_root_provider__
      root_linkage:
        description: Select how the root implementation is linked
        required: true
        type: choice
        options:
          - __select_root_linkage__
          # BEGIN GENERATED ROOT LINKAGE OPTIONS
          - none
          - lkm
          - builtin
          # END GENERATED ROOT LINKAGE OPTIONS
        default: __select_root_linkage__
      hook_mode:
        description: Select the root syscall hook mode
        required: true
        type: choice
        options:
          - __select_hook_mode__
          # BEGIN GENERATED HOOK MODE OPTIONS
          - none
          - tracepoint
          # END GENERATED HOOK MODE OPTIONS
        default: __select_hook_mode__
      config_profile:
        description: Select the audited release or debug configuration
        required: true
        type: choice
        options:
          - __select_config_profile__
          # BEGIN GENERATED CONFIG PROFILE OPTIONS
          - release
          - debug
          # END GENERATED CONFIG PROFILE OPTIONS
        default: __select_config_profile__
      uname_suffix:
        description: Optional appended uname suffix; empty or '-' plus ASCII letters, digits, '.', '_' or '-'
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: renebula-gki-${{ github.repository }}-${{ inputs.release_id }}-${{ inputs.root_provider }}-${{ inputs.root_linkage }}-${{ inputs.hook_mode }}-${{ inputs.config_profile }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable plan
    uses: ./.github/workflows/resolve-plan.yml
    with:
      release_id: ${{ inputs.release_id }}
      root_provider: ${{ inputs.root_provider }}
      root_linkage: ${{ inputs.root_linkage }}
      hook_mode: ${{ inputs.hook_mode }}
      config_profile: ${{ inputs.config_profile }}
      uname_suffix: ${{ inputs.uname_suffix }}

  verify:
    name: Verify resolved plan
    needs: resolve
    uses: ./.github/workflows/verify.yml
    with:
      plan_b64: ${{ needs.resolve.outputs.plan_b64 }}
      plan_sha256: ${{ needs.resolve.outputs.plan_sha256 }}

  build:
    name: Build locked Image
    needs: [resolve, verify]
    uses: ./.github/workflows/build.yml
    with:
      plan_b64: ${{ needs.resolve.outputs.plan_b64 }}
      plan_sha256: ${{ needs.resolve.outputs.plan_sha256 }}
