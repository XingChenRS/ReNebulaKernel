name: Resolve ReNebula build plan

on:
  workflow_call:
    inputs:
      release_id:
        description: Static immutable Google release identifier
        required: true
        type: string
      root_provider:
        description: Static audited root provider identifier
        required: true
        type: string
      root_linkage:
        description: Static audited root linkage identifier
        required: true
        type: string
      hook_mode:
        description: Static audited root hook-mode identifier
        required: true
        type: string
      config_profile:
        description: Static audited config profile identifier
        required: true
        type: string
      uname_suffix:
        description: Optional append-only uname suffix
        required: false
        type: string
        default: ""
    outputs:
      plan_b64:
        description: Canonical build-plan.json, encoded as one base64 line
        value: ${{ jobs.resolve.outputs.plan_b64 }}
      plan_sha256:
        description: SHA-256 of the canonical build-plan.json
        value: ${{ jobs.resolve.outputs.plan_sha256 }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan_b64: ${{ steps.emit.outputs.plan_b64 }}
      plan_sha256: ${{ steps.emit.outputs.plan_sha256 }}
    steps:
      - name: Check out ReNebula definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve the selected release
        id: emit
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          ROOT_PROVIDER: ${{ inputs.root_provider }}
          ROOT_LINKAGE: ${{ inputs.root_linkage }}
          HOOK_MODE: ${{ inputs.hook_mode }}
          CONFIG_PROFILE: ${{ inputs.config_profile }}
          UNAME_SUFFIX: ${{ inputs.uname_suffix }}
          PLAN_PATH: ${{ runner.temp }}/build-plan.json
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/resolve_plan.py \
            --release-id "$RELEASE_ID" \
            --root-provider "$ROOT_PROVIDER" \
            --root-linkage "$ROOT_LINKAGE" \
            --hook-mode "$HOOK_MODE" \
            --config-profile "$CONFIG_PROFILE" \
            --uname-suffix="$UNAME_SUFFIX" \
            --output "$PLAN_PATH"

          test -s "$PLAN_PATH"
          python3 -m json.tool "$PLAN_PATH" >/dev/null

          plan_size="$(wc -c < "$PLAN_PATH")"
          if [ "$plan_size" -gt 65536 ]; then
            echo "resolved plan is too large for workflow outputs: $plan_size bytes" >&2
            exit 1
          fi

          plan_sha256="$(sha256sum "$PLAN_PATH" | awk '{print $1}')"
          plan_b64="$(base64 --wrap=0 "$PLAN_PATH")"

          printf 'plan_sha256=%s\n' "$plan_sha256" >> "$GITHUB_OUTPUT"
          printf 'plan_b64=%s\n' "$plan_b64" >> "$GITHUB_OUTPUT"
