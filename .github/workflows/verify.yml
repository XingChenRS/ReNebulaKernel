name: Verify ReNebula multi-KMI definitions

on:
  pull_request:
    paths:
      - .github/**
      - locks/**
      - profiles/**
      - scripts/resolve_plan.py
      - scripts/sync_google_gki.py
      - scripts/validate_repository.py
      - scripts/verify_release.py
      - tests/**
  workflow_call:
    inputs:
      plan_b64:
        description: Canonical build-plan.json from resolve-plan.yml
        required: true
        type: string
      plan_sha256:
        description: SHA-256 accompanying plan_b64
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out ReNebula definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve or restore the plan under test
        env:
          PLAN_B64: ${{ inputs.plan_b64 }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          PLAN_PATH: ${{ runner.temp }}/build-plan.json
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$PLAN_B64" ]; then
            test -n "$PLAN_SHA256"
            printf '%s' "$PLAN_B64" | base64 --decode > "$PLAN_PATH"
            actual_sha256="$(sha256sum "$PLAN_PATH" | awk '{print $1}')"
            if [ "$actual_sha256" != "$PLAN_SHA256" ]; then
              echo "resolved plan digest mismatch" >&2
              exit 1
            fi
          else
            python3 scripts/resolve_plan.py \
              --release-id android14-6.1-lts-2026-08-03 \
              --output "$PLAN_PATH"
          fi

          test -s "$PLAN_PATH"
          python3 -m json.tool "$PLAN_PATH" >/dev/null
          cp "$PLAN_PATH" "$GITHUB_WORKSPACE/build-plan.json"

      - name: Check resolver determinism, registry coverage, and rejected input
        env:
          FIRST_PLAN: ${{ github.workspace }}/build-plan.json
          SECOND_PLAN: ${{ runner.temp }}/second-build-plan.json
          INVALID_PLAN: ${{ runner.temp }}/invalid-build-plan.json
        shell: bash
        run: |
          set -euo pipefail

          release_id="$(python3 - "$FIRST_PLAN" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              print(json.load(handle)["selection"]["release_id"])
          PY
          )"
          python3 scripts/resolve_plan.py --release-id "$release_id" --output "$SECOND_PLAN"
          cmp --silent "$FIRST_PLAN" "$SECOND_PLAN"

          python3 - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          import resolve_plan

          root = Path(".").resolve()
          registry, _ = resolve_plan.load_registry(root)
          for entry in registry["releases"]:
              plan = resolve_plan.resolve_plan(root, entry["id"])
              if plan["selection"]["family_id"] != entry["family_id"]:
                  raise SystemExit(f"family mismatch for {entry['id']}")
          PY

          if python3 scripts/resolve_plan.py --release-id unregistered-release --output "$INVALID_PLAN"; then
            echo "resolver accepted an unregistered release" >&2
            exit 1
          fi

      - name: Run repository contract and unit tests
        env:
          PLAN_PATH: ${{ github.workspace }}/build-plan.json
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          python3 scripts/validate_repository.py --plan "$PLAN_PATH"
          python3 -m unittest discover -s tests -v

      - name: Enforce workflow supply-chain rules
        shell: bash
        run: |
          set -euo pipefail

          while IFS=: read -r path line content; do
            reference="$(printf '%s\n' "$content" | sed -E 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/')"
            if [[ "$reference" == ./* ]]; then
              continue
            fi
            if [[ ! "$reference" =~ @[0-9a-fA-F]{40}$ ]]; then
              echo "unpinned action reference in $path:$line: $reference" >&2
              exit 1
            fi
          done < <(grep -RInE '^[[:space:]-]*uses:[[:space:]]*' .github --include='*.yml' --include='*.yaml')

      - name: Enforce source and root boundaries
        shell: bash
        run: |
          set -euo pipefail

          network_fetch='cur''l[[:space:]]*\||w''get[[:space:]]'
          if grep -RInE "($network_fetch|git[[:space:]]+(clone|pull)|repo[[:space:]]+(init|sync)|continue-on-error:[[:space:]]*true|\|\|[[:space:]]*true)" .github --include='*.yml' --include='*.yaml'; then
            echo "workflow contains a forbidden dynamic or failure-masking operation" >&2
            exit 1
          fi

          retired_terms='vi''vo|v''ki|is_''v''ki|vi''vo_tarball_url'
          definition_paths=(.github locks profiles)
          if grep -RInE "$retired_terms" "${definition_paths[@]}" --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml'; then
            echo "definitions contain a retired source family" >&2
            exit 1
          fi
