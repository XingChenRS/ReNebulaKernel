name: Verify ReNebula multi-KMI definitions

on:
  pull_request:
    paths:
      - .github/**
      - locks/**
      - profiles/**
      - scripts/resolve_plan.py
      - scripts/apply_root_adapter.py
      - scripts/sync_google_gki.py
      - scripts/validate_repository.py
      - scripts/verify_release.py
      - tests/**
  workflow_call:
    inputs:
      plan_b64:
        description: Canonical build-plan.json from resolve-plan.yml
        required: true
        type: string
      plan_sha256:
        description: SHA-256 accompanying plan_b64
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out ReNebula definition
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Restore and validate the caller-selected plan
        if: inputs.plan_b64 != ''
        env:
          PLAN_B64: ${{ inputs.plan_b64 }}
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          PLAN_PATH: ${{ runner.temp }}/build-plan.json
        shell: bash
        run: |
          set -euo pipefail

          test -n "$PLAN_B64"
          test -n "$PLAN_SHA256"
          printf '%s' "$PLAN_B64" | base64 --decode > "$PLAN_PATH"
          actual_sha256="$(sha256sum "$PLAN_PATH" | awk '{print $1}')"
          if [ "$actual_sha256" != "$PLAN_SHA256" ]; then
            echo "resolved plan digest mismatch" >&2
            exit 1
          fi

          test -s "$PLAN_PATH"
          python3 -m json.tool "$PLAN_PATH" >/dev/null
          python3 scripts/validate_repository.py --plan "$PLAN_PATH"

      - name: Resolve every enabled selector tuple deterministically
        env:
          PLANS_DIR: ${{ runner.temp }}/selector-plans
          INVALID_PLAN: ${{ runner.temp }}/invalid-build-plan.json
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$PLANS_DIR"
          while IFS=$'\t' read -r release_id root_provider root_linkage hook_mode config_profile; do
            first_plan="$PLANS_DIR/${release_id}-${root_provider}-${root_linkage}-${hook_mode}-${config_profile}.first.json"
            second_plan="$PLANS_DIR/${release_id}-${root_provider}-${root_linkage}-${hook_mode}-${config_profile}.second.json"
            python3 scripts/resolve_plan.py \
              --release-id "$release_id" \
              --root-provider "$root_provider" \
              --root-linkage "$root_linkage" \
              --hook-mode "$hook_mode" \
              --config-profile "$config_profile" \
              --output "$first_plan"
            python3 scripts/resolve_plan.py \
              --release-id "$release_id" \
              --root-provider "$root_provider" \
              --root-linkage "$root_linkage" \
              --hook-mode "$hook_mode" \
              --config-profile "$config_profile" \
              --output "$second_plan"
            cmp --silent "$first_plan" "$second_plan"
            python3 scripts/validate_repository.py --plan "$first_plan"
          done < <(python3 - <<'PY'
          from pathlib import Path
          import sys

          sys.path.insert(0, "scripts")
          import resolve_plan

          root = Path(".").resolve()
          registry, _ = resolve_plan.load_registry(root)
          for entry in registry["releases"]:
              family, _ = resolve_plan.load_family(root, entry["family_id"])
              for root_provider, root_linkage, hook_mode, config_profile in resolve_plan.allowed_selector_combinations(family):
                  print(f"{entry['id']}\t{root_provider}\t{root_linkage}\t{hook_mode}\t{config_profile}")
          PY
          )

          if python3 scripts/resolve_plan.py \
            --release-id unregistered-release \
            --root-provider none \
            --root-linkage none \
            --hook-mode none \
            --config-profile release \
            --output "$INVALID_PLAN"; then
            echo "resolver accepted an unregistered selector tuple" >&2
            exit 1
          fi

      - name: Run repository contract and unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          python3 -m unittest discover -s tests -v

      - name: Enforce workflow supply-chain rules
        shell: bash
        run: |
          set -euo pipefail

          while IFS=: read -r path line content; do
            reference="$(printf '%s\n' "$content" | sed -E 's/.*uses:[[:space:]]*([^[:space:]#]+).*/\1/')"
            if [[ "$reference" == ./* ]]; then
              continue
            fi
            if [[ ! "$reference" =~ @[0-9a-fA-F]{40}$ ]]; then
              echo "unpinned action reference in $path:$line: $reference" >&2
              exit 1
            fi
          done < <(grep -RInE '^[[:space:]-]*uses:[[:space:]]*' .github --include='*.yml' --include='*.yaml')

      - name: Enforce source and root boundaries
        shell: bash
        run: |
          set -euo pipefail

          network_fetch='cur''l[[:space:]]*\||w''get[[:space:]]'
          if grep -RInE "($network_fetch|git[[:space:]]+(clone|pull)|repo[[:space:]]+(init|sync)|continue-on-error:[[:space:]]*true|\|\|[[:space:]]*true)" .github --include='*.yml' --include='*.yaml'; then
            echo "workflow contains a forbidden dynamic or failure-masking operation" >&2
            exit 1
          fi

          retired_terms='vi''vo|v''ki|is_''v''ki|vi''vo_tarball_url'
          definition_paths=(.github locks profiles)
          if grep -RInE "$retired_terms" "${definition_paths[@]}" --include='*.py' --include='*.json' --include='*.yml' --include='*.yaml'; then
            echo "definitions contain a retired source family" >&2
            exit 1
          fi
